<style>
/* 遊んでいるあいだは夜の店のRPG（紫寄りの黒・白い二重枠の窓・ドット文字）。時間は自動で流れ、決断の場面だけ止まる。結果は白い紙の給与明細 */
:root {
  color-scheme: dark;
  --night: #0d0a12;
  --velvet: #181221;
  --velvet2: #231a30;
  --frame: #efeaf6;
  --line: rgba(239, 234, 246, .38);
  --mute: #a89eb8;
  --gold: #ecc66b;
  --rose: #ff73a8;
  --hp: #7fd39b;
  --mn: #8db9ff;
  --paper: #fbfbf8;
  --ink: #1f2430;
  --ink2: #5b6371;
  --rule: #c6ced8;
  --band: #2c2142;
  --pale: #f1f0f5;
  --red: #c8372d;
  --rose-ink: #a3165a;
  --dot: "DotGothic16", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --doc: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--frame); font-family: var(--doc); font-size: 15px; line-height: 1.7; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night); }
#app { max-width: 520px; margin: 0 auto; padding-block: 12px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
button { font: inherit; color: inherit; }
a { color: var(--gold); }
p { margin: 0; }
.win { background: var(--velvet); border: 6px double var(--frame); border-radius: 12px; padding: 12px 14px; font-family: var(--dot); min-width: 0; }
.win h2 { margin: 0 0 6px; font-weight: 400; font-size: 18px; color: var(--gold); text-wrap: balance; }
.mute { color: var(--mute); }
.small { font-size: 12px; }
.logo { font-family: var(--dot); text-align: center; color: var(--gold); margin: 34px 0 0; line-height: 1.15; font-size: clamp(46px, 15vw, 70px); letter-spacing: .04em; text-shadow: 3px 3px 0 #6b2a4d, 0 0 22px rgba(236, 198, 107, .35); }
.logo b { font-weight: 400; font-size: 1.45em; }
.logo span { display: block; font-size: .45em; letter-spacing: .1em; }
.tag { text-align: center; font-family: var(--dot); color: var(--mute); margin-top: -2px; }
.lede { text-align: center; font-family: var(--dot); font-size: 16px; margin: 10px 0 4px; text-wrap: balance; }
.played { text-align: center; font-family: var(--dot); color: var(--gold); font-size: 14px; }
.btn { display: block; width: 100%; font-family: var(--dot); font-size: 18px; color: var(--frame); background: var(--velvet2); border: 2px solid var(--frame); border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 0 #000; cursor: pointer; text-align: center; touch-action: manipulation; text-decoration: none; box-sizing: border-box; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
.btn.main { background: var(--gold); color: #2a1b06; border-color: #fff0c4; font-size: 20px; }
.btn.ghost { background: transparent; border-color: var(--line); box-shadow: none; font-size: 15px; padding: 9px 12px; }
.btn:focus-visible, .choice:focus-visible, .seg button:focus-visible, .tog:focus-visible, .store:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-family: var(--dot); font-size: 14px; }
.links button { background: none; border: 0; color: var(--mute); cursor: pointer; padding: 4px; text-decoration: underline; text-underline-offset: 3px; }
.foot { text-align: center; font-size: 11px; color: var(--mute); line-height: 1.6; margin-top: 8px; }
.cur { display: inline-block; animation: blink .8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.choices { display: flex; flex-direction: column; gap: 9px; }
.choice { display: block; width: 100%; text-align: left; font-family: var(--dot); font-size: 16px; line-height: 1.5; color: var(--frame); background: var(--velvet2); border: 2px solid rgba(239, 234, 246, .85); border-radius: 10px; padding: 11px 14px 11px 34px; position: relative; cursor: pointer; box-shadow: 0 3px 0 #000; touch-action: manipulation; }
.choice::before { content: '▶'; position: absolute; left: 12px; top: 12px; color: var(--gold); font-size: 13px; opacity: .5; }
.choice:hover::before, .choice.pick::before { opacity: 1; animation: blink .6s steps(1) infinite; }
.choice.pick { border-color: var(--gold); }
.choice:disabled { opacity: .38; cursor: not-allowed; }
.choice small { display: block; font-size: 12px; color: var(--mute); }
.choice small.hint { font-size: 11.5px; color: #b9a9cf; opacity: .85; margin-top: 1px; }
.danger { margin-top: 6px; font-size: 12px; color: var(--rose); line-height: 1.5; }
.pz { font-size: 12px; color: var(--gold); }
.tog.dim { opacity: .45; }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; width: max-content; max-width: min(92vw, 480px); box-sizing: border-box; background: var(--velvet2); border: 2px solid var(--gold); border-radius: 10px; padding: 9px 14px; font-family: var(--dot); font-size: 14px; line-height: 1.5; color: var(--frame); box-shadow: 0 4px 0 #000; animation: tin .2s ease-out; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, 8px); } }
.guide ul { margin: 4px 0 0; padding-left: 1.2em; }
.guide li { font-size: 13px; line-height: 1.7; margin-top: 2px; }

/* ステータス（いつも上に）。上に貼りつくのは大事な数字だけ。くわしい中身は「くわしく▼」で別の画面に出す */
.stat { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding: 6px 10px 7px; border-width: 4px; line-height: 1.35; }
.stat .top { display: flex; justify-content: space-between; align-items: baseline; gap: 2px 8px; }
.stat .when { color: var(--gold); font-size: 15px; white-space: nowrap; }
.stat .where { color: var(--mute); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right; }
.stat .restb { font-size: 11px; color: var(--mn); border: 1px solid var(--mn); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 8px; margin-top: 3px; }
.kv i { display: block; font-style: normal; color: var(--mute); font-size: 10.5px; white-space: nowrap; }
.kv b { font-weight: 400; font-size: 15px; white-space: nowrap; }
.kv b small { font-size: 11px; color: var(--mute); margin-left: 1px; }
.kv .gold { color: var(--gold); }
.bars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.stat .danger { margin-top: 4px; font-size: 11.5px; line-height: 1.4; }
.stat .danger > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linkbtn { background: none; border: 0; color: var(--gold); font-family: var(--dot); font-size: 11px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0 0 0 6px; }
.me { font-size: 12px; color: var(--mute); font-family: var(--dot); margin-top: 4px; }
.howto details { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
.howto summary { cursor: pointer; color: var(--gold); font-size: 15px; }
.fr { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 10px; padding: 2px 0 0 10px; font-size: 13px; }
.fr span { min-width: 0; }
.fr b { white-space: nowrap; margin-left: auto; }
.fr.up b { color: var(--red); }
.fr.down b { color: var(--ink2); }
.bars i { display: flex; justify-content: space-between; font-style: normal; color: var(--mute); font-size: 11px; }
.bars i b { font-weight: 400; color: var(--frame); }
.seg10 { display: flex; gap: 2px; }
.seg10 span { flex: 1; height: 7px; background: rgba(239, 234, 246, .12); }
.seg10 span.on { background: var(--c); }
.more { margin-top: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 12px; font-size: 13px; }
.more div { display: flex; justify-content: space-between; gap: 6px; min-width: 0; }
.more div span { color: var(--mute); }
.more > div:not(.wide) > span { white-space: nowrap; }
.more div.wide { grid-column: 1 / -1; display: block; }
.more div.wide b { font-weight: 400; }
.more .legend { grid-column: 1 / -1; display: block; font-size: 11px; color: var(--mute); line-height: 1.6; margin-top: 2px; }
.morebtn { background: none; border: 0; color: var(--mute); font-family: var(--dot); font-size: 12px; cursor: pointer; padding: 0 0 0 6px; }

/* 時間の操作 */
.clock { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-family: var(--dot); }
.tog { font-family: var(--dot); font-size: 14px; padding: 7px 10px; background: transparent; color: var(--frame); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.tog.on { border-color: var(--gold); color: var(--gold); }
.tog.play { min-width: 46px; }
.seg { display: flex; gap: 4px; align-items: center; flex: 1 1 220px; min-width: 0; }
.seg > span { color: var(--mute); font-size: 12px; white-space: nowrap; }
.seg button { flex: 1; min-width: 0; font-family: var(--dot); font-size: 13px; padding: 6px 0; background: transparent; color: var(--frame); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--gold); color: #2a1b06; border-color: var(--gold); }
.seg button:disabled { opacity: .22; cursor: not-allowed; }
.pacenote { font-size: 11px; color: var(--mute); font-family: var(--dot); margin-top: 4px; }
@media (max-width: 430px) { /* スマホ：操作パネルの行が折り返さないように詰める */
  .clock { gap: 4px; }
  .tog { font-size: 12.5px; padding: 6px 7px; }
  .clock [data-sp] { padding: 6px 5px; }
  .seg { flex: 1 1 170px; gap: 3px; }
  .seg button { font-size: 12px; }
  .clock.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .clock.acts .tog { padding: 6px 2px; font-size: 11.5px; line-height: 1.25; }
}
.wacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.wacts .tog { font-size: 12.5px; padding: 6px 9px; border-color: var(--gold); color: var(--gold); }
.wacts .tog:disabled { opacity: .35; cursor: not-allowed; }
ol.les { margin: 2px 0 4px; padding-left: 1.4em; font-size: 13px; line-height: 1.65; }
ol.les li + li { margin-top: 4px; }
.pacenote b { font-weight: 400; color: var(--rose); }

/* 決断 */
.decide { border-color: var(--gold); }
.decide .lab { color: var(--gold); font-size: 12px; letter-spacing: .08em; margin-bottom: 4px; }
.decide .txt p + p { margin-top: 2px; }
.decide .choices { margin-top: 10px; }

/* 人生の記録 */
.feed { font-family: var(--dot); padding: 10px 12px; }
.feed h3 { margin: 0 0 4px; font-weight: 400; font-size: 13px; color: var(--mute); display: flex; justify-content: space-between; }
.mo { padding: 6px 0; border-top: 1px dashed rgba(239, 234, 246, .18); }
.mo:first-of-type { border-top: 0; }
.mo .ml { font-size: 12px; color: var(--mute); }
.mo p { font-size: 14px; line-height: 1.65; }
.mo .ev { color: var(--frame); }
.mo .pick { color: var(--gold); }
.mo .out { color: #d9d2e4; }
.mo .sum { color: var(--mute); font-size: 13px; }
.mo .sum b { font-weight: 400; color: var(--gold); }
.mo .ms { color: var(--rose); }
.mo .hint { color: var(--mute); }
.mo .nichi { color: #cfc6dc; font-size: 13px; }
.mo .nichi::before { content: '・'; color: var(--mute); }
.mo .warn { color: var(--rose); font-size: 13px; }
.mo .note { color: #cfc6dc; font-size: 13px; }
.mo .year { color: var(--gold); text-align: center; padding: 4px 0; }
.feedmore { background: none; border: 0; color: var(--mute); font-family: var(--dot); font-size: 13px; cursor: pointer; text-decoration: underline; padding: 6px 0 0; }

/* 生まれ */
.prof { font-family: var(--dot); }
.prof .rowx { display: grid; grid-template-columns: 6.5em 1fr; gap: 8px; padding: 6px 0; border-top: 1px dashed rgba(239, 234, 246, .18); align-items: center; }
.prof .rowx:first-of-type { border-top: 0; }
.prof .k { color: var(--mute); font-size: 13px; }
.prof .v { font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.prof .num { display: flex; align-items: center; gap: 8px; }
.prof .num b { font-weight: 400; font-size: 22px; color: var(--gold); min-width: 2.2em; }
.prof .num .barw { flex: 1; height: 8px; background: rgba(239, 234, 246, .12); }
.prof .num .barw span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--rose)); width: 0; transition: width .7s ease-out; }
.prof .sub { font-size: 12px; color: var(--mute); }
.hide { visibility: hidden; }

/* 店さがし */
.stores { display: flex; flex-direction: column; gap: 10px; }
.store { display: block; width: 100%; text-align: left; font-family: var(--dot); background: var(--velvet2); border: 2px solid rgba(239, 234, 246, .8); border-radius: 10px; padding: 10px 12px; cursor: pointer; box-shadow: 0 3px 0 #000; color: var(--frame); }
.store:disabled { opacity: .45; cursor: not-allowed; }
.store .nm { display: flex; justify-content: space-between; gap: 8px; font-size: 16px; }
.store .nm b { font-weight: 400; color: var(--gold); white-space: nowrap; }
.store .tg { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; margin-top: 4px; }
.store .tg span { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: #d9d2e4; }
.store .tg .warn { border-color: var(--rose); color: var(--rose); }
.store .tg .okc { border-color: var(--gold); color: var(--gold); }
.store .nm small { color: var(--mute); font-size: 12px; }
.disc { font-size: 12px; color: var(--mute); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--dot); }

/* かさねる画面 */
.ov { position: fixed; inset: 0; z-index: 40; background: rgba(8, 6, 12, .95); overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ov .box { max-width: 520px; margin: 2vh auto 0; display: flex; flex-direction: column; gap: 10px; }
.ov .btn.ghost { background: var(--night); }
.bigc { text-align: center; }
.bigc .n { font-size: clamp(32px, 11vw, 50px); color: var(--gold); line-height: 1.2; }
.bigc .oku { font-size: clamp(40px, 13vw, 60px); color: var(--rose); text-shadow: 0 0 18px rgba(255, 115, 168, .6); }
.howto h3 { margin: 12px 0 2px; font-weight: 400; color: var(--gold); font-size: 16px; }
.howto p, .howto li { font-size: 14px; line-height: 1.75; }
.howto ul { margin: 4px 0 0; padding-left: 1.2em; }
.howto dl { margin: 4px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; font-size: 13px; }
.howto dt { color: var(--gold); }
.howto dd { margin: 0; }

/* 紙（明細・結果） */
.paper { background: var(--paper); color: var(--ink); font-family: var(--doc); border-radius: 4px; overflow: hidden; min-width: 0; }
.pband { background: var(--band); color: #fff; padding: 8px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pband b { font-size: 15px; letter-spacing: .04em; }
.pband span { font-size: 12px; opacity: .85; }
.pcap { background: var(--pale); color: var(--band); font-weight: 700; padding: 7px 12px; font-size: 14px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 8px; }
.pcap small { font-weight: 400; color: var(--ink2); }
.prow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.prow:last-child { border-bottom: 0; }
.prow > span:first-child { color: var(--ink2); min-width: 0; flex: 0 0 auto; max-width: 62%; }
.prow > b, .prow > span:last-child { text-align: right; }
.prow.total { background: #f7f3e6; font-weight: 700; }
.prow.total > b { font-size: 17px; }
.pnote { font-size: 12px; color: var(--ink2); padding: 8px 12px; line-height: 1.6; }
.big { padding: 16px 12px 14px; text-align: center; }
.big .lab { font-size: 13px; color: var(--ink2); }
.big .num { font-size: clamp(30px, 10vw, 44px); font-weight: 700; line-height: 1.25; letter-spacing: .01em; }
.big .num.oku { color: var(--rose-ink); }
.big .sub2 { font-size: 13px; color: var(--ink2); margin-top: 2px; }
.type { text-align: center; padding: 12px 12px 14px; border-top: 1px solid var(--rule); }
.type .t1 { font-size: 12px; color: var(--ink2); }
.type .t2 { font-size: clamp(22px, 7vw, 28px); font-weight: 700; line-height: 1.35; text-wrap: balance; }
.axes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.axes > div { text-align: center; padding: 8px 2px; border-right: 1px solid var(--rule); min-width: 0; }
.axes > div:last-child { border-right: 0; }
.axes i { display: block; font-style: normal; font-size: 12px; color: var(--ink2); }
.axes b { font-size: 24px; }
.axes small { display: block; font-size: 10.5px; color: var(--ink2); line-height: 1.3; }
.fork { padding: 9px 12px; border-bottom: 1px solid var(--rule); font-size: 14px; line-height: 1.65; }
.fork:last-child { border-bottom: 0; }
.fork .w { font-weight: 700; margin-right: 6px; }
.fork .ifr { color: var(--red); }
.fork .ifw { color: var(--ink2); }
.path { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 8px 12px; font-size: 13px; align-items: center; }
.path span.st { border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; background: #fff; }
.share { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.share a { font-size: 15px; padding: 11px 4px; }
.share a.rp { grid-column: 1 / -1; }
.loading { color: var(--ink2); font-size: 13px; padding: 10px 12px; }
.cardimg { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); }
/* 売上グラフ（月ごとの売上の線グラフ） */
.lchart { padding: 8px 6px 2px; background: #fff; }
.lchart svg { display: block; width: 100%; height: auto; font-family: var(--doc); }
.lchart .gl { stroke: rgba(70, 120, 200, .18); stroke-width: 1; }
.lchart .ax { stroke: var(--ink); stroke-width: 1.2; }
.lchart .yl { font-size: 9px; fill: var(--ink2); text-anchor: end; }

        : `<button class="btn main" id="start" type="button"><span class="cur">▶</span> 人生${n + 1}周目をはじめる</button>`}

      <p class="foot">数字はゲームの目安です。実在の店・人物とは関係ありません。<br>つくった人：<a href="https://grace-sc.com" target="_blank" rel="noopener">GRACE SELECTION</a></p>`;
    if (sv) $('#cont').onclick = () => { try { S = G.revive(sv); resume(); } catch (e) { LS.del('save'); title(); } };
    $('#start').onclick = () => { LS.del('save'); askName(); };

    $('#recs').onclick = records;
  }

  // ── 源氏名 ──
  function askName() {
    const pick = () => NAMES[Math.floor(Math.random() * NAMES.length)];
    app.innerHTML = `
      <div class="win">
        <h2>源氏名を決めてください</h2>
        <input id="nm" maxlength="8" autocomplete="off" placeholder="8文字まで" style="width:100%;box-sizing:border-box;font-family:var(--dot);font-size:20px;padding:10px 12px;border-radius:8px;border:2px solid var(--frame);background:var(--night);color:var(--frame)">
        <p class="mute small" style="margin-top:6px">※ 本名は入れないでね。結果の画像とシェアの文に出ます。</p>
      </div>
      <div class="row2"><button class="btn ghost" id="rnd" type="button">おまかせ</button><button class="btn main" id="ok" type="button">決定</button></div>
      <button class="btn ghost" id="back" type="button">もどる</button>`;
    const inp = $('#nm');

  function start(s, same) {
    S = s; AN = null; FEEDALL = false; AUTO = false; PAUSED = false; LS.set('lives', lives() + 1); // おまかせは人生ごとに OFF から（方針は覚えておく）
    S.life = lives(); S.phase = 'store'; S.feed = []; save();
    birth(same);
  }

  // ── 生まれ（プロフィールを1行ずつ明かす） ──
  function barRow(k, v, sub) { return `<div class="rowx"><div class="k">${k}</div><div class="v"><div class="num"><b data-n="${v}">0</b><div class="barw"><span data-w="${v}"></span></div></div>${sub ? `<div class="sub">${sub}</div>` : ''}</div></div>`; }
  async function birth(same) {
    const run = ++RUN, t = S.t, e = S.e;
    app.innerHTML = `
      <div class="win"><h2>${same ? `同じ生まれで、もう一度（人生${S.life}周目）` : `今回の生まれ（人生${S.life}周目）`}</h2><p class="small mute">${same ? '運だけが変わる。' : 'ステータスは1〜100。中身は働いてみるまでわからない。'}</p></div>
      <div class="win prof" id="prof">
        <div class="rowx hide"><div class="k">生年月日</div><div class="v">${e.by}年${e.bm}月${e.bd}日生まれ・${e.age}歳</div></div>
        <div class="rowx hide"><div class="k">出身</div><div class="v">${esc(G.homeName(e))}${e.pref !== '東京都' ? `<div class="sub">近くの夜の街：${esc(G.areaName(e))}</div>` : ''}</div></div>
        <div class="hide">${barRow('ルックス', t.face, `系統：${esc(t.kei)}`)}</div>
        <div class="hide">${barRow('スタイル', t.style, `${t.height}cm・${t.weight}kg・${t.cup}カップ`)}</div>
        <div class="hide">${barRow('お酒の強さ', t.sake, e.age < 20 ? '20歳になるまでは飲めない' : '')}</div>
        <div class="rowx hide"><div class="k">性格</div><div class="v">${esc(t.seikaku)}<div class="sub">${esc(G.SEIKAKU[t.seikaku])}</div></div></div>
        <div class="rowx hide"><div class="k">いまの暮らし</div><div class="v">${e.sumai === '実家' ? '実家暮らし' : '一人暮らし'}・${esc(e.hiru)}<div class="sub">${esc(e.keiken)}・始めた理由：${esc(e.reason)}</div></div></div>
        <div class="rowx hide"><div class="k">中身</div><div class="v">？？？<div class="sub">トーク・マメさ・心の強さなど。最後に明かされる。</div></div></div>
      </div>
      <div class="choices" id="choices"></div>`;
    const rows = [...$('#prof').children];
    for (const r of rows) {
      if (run !== RUN) return;
      await sleep(RM ? 0 : 380);
      r.classList.remove('hide');
      r.querySelectorAll('[data-w]').forEach(x => { x.style.width = x.dataset.w + '%'; });
      r.querySelectorAll('[data-n]').forEach(x => countUp(x, +x.dataset.n));
    }
    if (run !== RUN) return;
    const gl = G.goalOf(S);
    $('#choices').innerHTML = `<p class="small" style="font-family:var(--dot);text-align:center">${e.age}歳。${esc(REASON_LINE[e.reason])}、夜の仕事を始めることにした。源氏名は「${esc(S.name)}」。<br>お金の目的：${esc(gl.label)}</p>
      <div class="win guide"><h2 style="font-size:15px;margin:0">この子の攻め方（目安）</h2><ul>${G.guide(S).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      <button class="btn main" id="go" type="button"><span class="cur">▶</span> 最初の店を探す</button>`;
    $('#go').onclick = () => search({ why: 'start' });
  }
  function countUp(el, to) {
    if (RM) { el.textContent = to; return; }
    const t0 = performance.now();
    const f = t => { const k = Math.min(1, (t - t0) / 600); el.textContent = Math.round(to * k); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  }

  // ── 店さがし（最初の店・移籍・クビのあと） ──
  // 入り方を選ぶ → （スカウトなら、どんなスカウトか）→ 店を選ぶ → 面接
  function search(w) {
    const run = ++RUN; stopClock();
    S.phase = S.store ? 'search' : 'store'; save();
    const first = !S.store, working = S.store && !S.flags.noStore;
    const canStay = !first && working;
    const body = (html) => { app.innerHTML = '<div class="win stat" id="stat"></div>' + html; renderStat(); };
    // 店選びで効く見た目（上に貼りつくステータスには出さず、店を選ぶ画面の中に出す）
    const meLine = () => `<p class="me">あなた：ルックス${S.t.face}・スタイル${S.t.style}（${S.t.height}cm・${S.t.weight}kg・${esc(S.t.cup)}カップ）・系統は${esc(S.t.kei)}・${esc(S.t.hair || '黒髪')}・${S.age}歳${S.age < 20 ? '（お酒はまだ飲めない）' : `・お酒の強さ${S.t.sake}`}</p>`;
    const why = { start: '最初の店を探す', hoshoAke: '移籍先を探す', quit: '次の店を探す', kubi: '次の店を探す（クビになった）', heiten: '次の店を探す（店が閉まった）', idle: '次の店を探す', scout: 'スカウトに店を聞く', shukkin: '出勤がゆるい店を探す', mioku: '次の店を探す（声をかけられた店に見送られた）', bare: '次の店を探す（面接がバレた店から移る）', gbCaba: 'キャバクラを探す', okane: '稼ぎやすい店を探す', chigau: '次の店を探す（聞いていた話と違う店を辞めた）' }[w.why] || '店を探す';
    let failed = ''; // 面接に落ちた店（落ちたあとは、見出しを「ほかの店を探す」にする）
    const log = []; // 面接の結果（落ちた分も）を、最後に記録へまとめて入れる
    const leakNote = working ? '<p class="small mute" style="margin-top:4px">在籍したまま他の店の面接を受けると、今の店にバレることがある（求人は2割・友達の紹介は1割・スカウト経由は5%くらい）。</p>' : '';
    const step1 = () => {
      if (w.route === 'scout' && !w.used) { w.used = 1; return step2scout(w.profile || 'mise'); }
      const sh = G.canShokai(S);
      body(`
        <div class="win"><h2>${esc(failed ? 'ほかの店を探す' : why)}</h2>${failed ? `<p class="small">${esc(failed)}の面接は、落ちてしまった。</p>` : ''}<p class="small">どうやって探す？</p>${leakNote}</div>
        <div class="choices">
          <button class="choice" type="button" data-r="kyujin">求人サイトで探す<small>店はたくさん並んでいる。条件は、入ってみないとわからないこともある。</small></button>
          <button class="choice" type="button" data-r="scout">スカウトを使う<small>いろんなスカウトがいる。</small></button>
          ${sh ? '<button class="choice" type="button" data-r="shokai">友達の紹介<small>友達が働いている店を紹介してもらう。選べる店は少ない。</small></button>' : ''}
          ${canStay ? '<button class="choice" type="button" data-r="stay">やっぱり今の店に残る</button>' : ''}
          ${!first && !working ? '<button class="choice" type="button" data-r="rest">今月は店を探さずに休む</button>' : ''}
        </div>`);
      app.querySelectorAll('.choice[data-r]').forEach(b => b.onclick = () => {
        const r = b.dataset.r;
        if (r === 'stay' || r === 'rest') { G.cancelSearch(S); if (r === 'rest' && !S.flags.noStore) S.flags.noStore = 1; return done(r === 'stay' ? '今の店に残ることにした。' : '今月は休むことにした。'); }
        if (r === 'scout') return step2();
        step3(r, '', '');
      });
    };
    const step2 = () => {
      // 前に使ったスカウト（新しい順）にまた頼める。同じ人なので、どんなスカウトかも前と同じ
      const prev = S.scouts.map((x, i) => [x, i]).reverse();
      body(`
        <div class="win"><h2>どのスカウトに頼む？</h2><p class="small">スカウトにもいろんなタイプがいる。どんな人かは、使ってみるまでわからない。</p></div>
        <div class="choices">
          ${prev.map(([x, i]) => `<button class="choice" type="button" data-p="${x.profile}" data-i="${i}">前に使った${esc(x.name)}にまた頼む<small>${esc(G.SCOUT_PROFILE[x.profile].label)}・${esc(G.label(x.m))}に使った${x.joined ? '・この人の紹介で入店した' : ''}</small></button>`).join('')}
          ${Object.entries(G.SCOUT_PROFILE).filter(([k]) => k !== 'mise' || working).map(([k, p]) => `<button class="choice" type="button" data-p="${k}">${prev.length ? '新しく、' : ''}${esc(p.label)}に頼む</button>`).join('')}
          <button class="choice" type="button" data-p="">もどる</button>
        </div>`);
      app.querySelectorAll('.choice[data-p]').forEach(b => b.onclick = () => (b.dataset.p ? step2scout(b.dataset.p, b.dataset.i === undefined ? -1 : +b.dataset.i) : step1()));
    };
    const step2scout = (profile, idx = -1) => {
      const sc = G.contactScout(S, S.luck, profile, idx); save();
      if (sc.blocked) {
        body(`<div class="win"><h2>${esc(sc.name)}に連絡した</h2><p>LINEを送ったが、既読がつかない。電話もつながらない。ブロックされていた。</p></div><button class="btn" type="button" id="bk">ほかの方法で探す</button>`);
        $('#bk').onclick = step1;
        return;
      }
      step3('scout', sc.type, sc.profile, sc);
    };
    const step3 = (route, scout, profile, sc) => {
      if (run !== RUN) return;
      const opts0 = G.searchView(S, route, scout, profile);
      const opts = w.why === 'shukkin' ? opts0.slice().sort((a, b) => a.minPace - b.minPace || b.tier - a.tier) : opts0; // 出勤がゆるい店を探すときは、目安がゆるい順
      const head = route === 'kyujin' ? '求人サイトには「保証あり・高時給」の店がたくさん並んでいる。' : route === 'shokai' ? '友達が働いている店を紹介してもらえることになった。'
        : sc && sc.again ? `前にも頼んだ${esc(sc.name)}に、また連絡した。${SCOUT_AGAIN[scout] || SCOUT_SAY[scout]}` : `${esc(G.SCOUT_PROFILE[profile].label)}の${sc ? esc(sc.name) : ''}に連絡した。${SCOUT_SAY[scout]}`;
      const distTag = d => (d === 3 ? '<span class="warn">遠い：持ち客はほぼ来られない</span>' : d === 2 ? '<span class="warn">持ち客は一部だけ通える</span>' : '');
      body(`
        <div class="win"><h2>店を選ぶ</h2><p class="small">${head}</p>${meLine()}<p class="small mute" style="margin-top:4px">％は面接に通る確率。見た目・系統・年齢・これまでの売上で変わる。手取りは、保証のあいだに週◯日出たときの目安（源泉と厚生費・送り代を引いたあと）。ノルマに届かないと罰金がある。ガールズバーは時給も単価も低いが、だれでも入りやすく、売上でクビにならない。${route === 'kyujin' ? '求人に書いていない条件があることもある。' : ''}${w.why === 'shukkin' ? '<br>出勤の目安がゆるい順に並べた。' : ''}</p><p class="small mute" style="margin-top:2px">面接に通ったら、条件を見てから入るかどうかを決められる。</p></div>
        <div class="stores">${opts.map(o => `
          <button class="store" type="button" data-id="${o.id}" data-area="${esc(o.area)}" ${o.ng || o.hairNg || o.fake ? 'disabled' : ''}>
            <div class="nm"><span>${esc(o.label)}</span><b>${o.fake ? '求人がおかしかった' : o.hairNg ? '髪色がNG' : o.ng ? '今月は×' : o.p + '%'}</b></div>
            <div class="tg"><span>保証時給 ${yen(o.guar[0])}〜${yen(o.guar[1])}円（あなたは${o.estWage > o.guar[1] ? '売上があるので' : ''}${yen(o.estWage)}円くらい）</span><span>在籍${o.cast}人くらい</span><span>保証中の手取り 月${man(o.tedori)}円くらい（週${o.pace}日）</span><span class="${o.paceNg ? 'warn' : ''}">週${o.minPace}日〜${o.paceNg ? `（あなたは週${o.max}日まで：店の評価と時給が下がる）` : ''}</span><span class="${o.norma === 'ノルマなし' ? '' : 'warn'}">${esc(o.norma)}</span><span>厚生費 ${o.kousei ? `1出勤${yen(o.kousei)}円` : 'なし'}</span>${o.joukyou ? `<span class="warn">上京・一人暮らし（費用${o.joukyouCost}万円）</span>` : ''}${o.tsuu ? `<span>${esc(o.tsuu)}まで通う</span>` : ''}${o.fit ? `<span class="${o.fit === '系統が合う' ? 'okc' : ''}">${o.fit}</span>` : ''}${distTag(o.dist)}</div>
          </button>`).join('')}</div>
        <button class="btn ghost" type="button" id="back">入り方を選びなおす</button>`);
      $('#back').onclick = step1;
      app.querySelectorAll('.store').forEach(b => b.onclick = () => step4(b.dataset.id, route, scout, profile, sc ? sc.idx : -1, b.dataset.area, sc));
    };
    const step4 = async (id, route, scout, profile, sidx, area, sc) => {
      const label = G.SLx(S, id, area);
      const res = G.applyStore(S, id, route, scout, profile, sidx, area);
      save();
      if (!res.ok) log.push(`${label}の面接を受けた。`, ...res.lines);
      body(`<div class="win"><h2>${esc(label)}の面接</h2>${res.lines.map(t => `<p>${esc(t)}</p>`).join('')}</div><div class="choices" id="choices"></div>`);
      const box = $('#choices');
      if (!res.ok) { // 面接に落ちた：同じ一覧から選びなおすか、ほかの探し方にするか

        if ($('#list')) $('#list').onclick = () => step3(route, scout, profile, sc);
        $('#again').onclick = step1;

      }

    };
    // 面接に通った：条件を見て、入店するか辞退するかを決める
    const offerScreen = (v, lines) => {
      if (run !== RUN) return;

      body(`
        <div class="win"><h2>${esc(v.label)}の面接</h2>${lines.map(t => `<p>${esc(t)}</p>`).join('')}<p class="small mute" style="margin-top:4px">入るかどうかは、この条件を見てから決められる。</p></div>
        <div class="paper">
          <div class="pcap">この店の条件</div>
          <div class="prow"><span>保証時給</span><b>${yen(v.wage)}円</b></div>
          <div class="prow"><span>保証の期間<br><small>${v.gb ? 'ガールズバーは最初の1か月だけ' : 'このあいだは売上に関係なく、この時給'}</small></span><b>${v.hosho}か月</b></div>
          <div class="prow"><span>出勤の目安</span><b>週${v.minPace}日〜</b></div>

          ${v.joukyou ? `<div class="prow"><span>上京・一人暮らしの費用</span><b>${v.joukyouCost}万円<br><small style="font-weight:400">貯金 ${signed(v.save)}円 → ${signed(v.save - v.joukyouCost)}円</small></b></div>` : ''}
          ${v.tsuu ? `<div class="prow"><span>通い方</span><b>家から${esc(v.tsuu)}まで通う</b></div>` : ''}
          <div class="prow total"><span>保証中の手取り（目安）<br><small style="font-weight:400">週${v.pace}日・1日4時間。源泉と引かれ物を引いたあと</small></span><b>月${man(v.tedori)}円</b></div>
          ${v.keep >= 0 ? `<div class="prow"><span>ついてきそうな持ち客</span><b>${v.nCust}人中 ${v.keep}人くらい</b></div>` : ''}
          <div class="pnote">${v.route === 'kyujin' ? '求人の条件は、入ってみると違うことがある。' : ''}${v.first ? '' : `入店は${esc(v.start)}から。`}保証が明けると、時給は売上で決まる。${v.keepFirst ? `はじめての店なので、保証のうちに指名を${v.keepFirst}人つかんで出勤の目安を守れば、保証の時給のまま続けられる。` : ''}この店のNo.1は月${man(v.top)}円くらい。</div>
        </div>
        <div class="choices" id="choices">
          <button class="btn main" type="button" id="join"><span class="cur">▶</span> この条件で入店する</button>
          ${v.route === 'scout' && !v.nego ? `<button class="btn" type="button" id="nego">${esc(v.scoutName || 'スカウト')}に条件を交渉してもらう<small style="display:block;font-size:12px;opacity:.8;margin-top:2px">保証の延長と時給アップを頼む。うまくいくかはスカウトしだいで、強気すぎると話がなくなることもある</small></button>` : ''}
          <button class="btn ghost" type="button" id="dec">辞退して、ほかの店を探す</button>
          ${canStay ? '<button class="btn ghost" type="button" id="decStay">辞退して、今の店に残る</button>' : ''}
        </div>`);
      $('#join').onclick = () => { const L = G.acceptOffer(S); save(); done(null, pre.concat(L)); };
      if ($('#nego')) $('#nego').onclick = () => {
        const ng = G.negotiate(S); save();
        if (ng.view) return offerScreen(ng.view, lines.concat(ng.lines));
        log.push(...pre, ...ng.lines); // 話がなくなった
        body(`<div class="win"><h2>${esc(v.label)}</h2>${ng.lines.map(t => `<p>${esc(t)}</p>`).join('')}</div><div class="choices" id="choices"><button class="btn" type="button" id="again">ほかの店を探す</button>${canStay ? '<button class="btn ghost" type="button" id="stay">今の店に残る</button>' : ''}</div>`);

    if (AUTO && !first && !PAUSED && w.why !== 'quit') { G.autoSearch(S, S.pol, POL); return done(`（おまかせ：${POLS[POL][0]}で店を探した）`); } // 自分で「新しい店を探す」を押したときは、自分で選ぶ
    step1();
  }

  // ── 毎月（時間が流れて、決断で止まる） ──
  function play() {
    const run = ++RUN;

    app.innerHTML = `
      <div class="win stat" id="stat"></div>
      <div class="win" style="padding:9px 12px">

    app.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { SPEED = +b.dataset.sp; LS.set('speed', SPEED); go(); });

    $('#quit').onclick = quitMenu;
    $('#meisai').onclick = meisai;
    $('#menu').onclick = menu;
    renderStat(); renderPace(); renderFeed(); renderClock();

    renderClock();
    schedule();
  }
  // おまかせ：使うかどうかと、方針を選ぶ
  function autoMenu() {
    const ov = overlay(`<div class="win"><h2>おまかせ</h2><p class="small">決断の場面を、方針にそって自動で選ぶ。店さがしもおまかせで進む。出勤ペースは自分で決める。<br>人生が終わる選択（辞める・結婚して引退など）と、付き合う・枕・浮気・薬などは選ばない。営業のやり方は、性格に合うものを選ぶ。</p></div>
      <div class="choices">${['', 'ken', 'bal', 'uri'].map(k => `<button class="choice${(AUTO ? POL : '') === k ? ' pick' : ''}" type="button" data-a="${k}">${k ? `おまかせ：${POLS[k][0]}` : 'おまかせを使わない（自分で選ぶ）'}<small>${k ? esc(POLS[k][1]) : '決断の場面で止まる'}</small></button>`).join('')}</div>`);

  }
  function resume() { if (!S.store) { birth(); return; } play(); }

  }
  function stepMonth() {
    if (BUSY || !S || S.ended || S.phase !== 'begin') return;

  // 止まらない出来事（選べるのが1つ・いつも通り）をそのまま進める

  // ⚠ の前ぶれが出たら、おまかせ中でも一度止める（休む・出勤を減らすなどの手を打てるように）

  function warnActs(warns) {
    const a = [];

  }
  const WACT = { rest: () => '1か月休む', down: () => `出勤を減らす（週${S.pace}→${S.pace - 1}）`, up: () => `出勤を増やす（週${S.pace}→${S.pace + 1}）`, ikinuki: () => '気分転換する', search: () => '新しい店を探す', eigyo: () => '営業（やり方・連絡）' };
  function pauseWarn(warns, m) {
    PAUSED = true; RUNNING = false; SKIPTO = false; clearTimeout(TIMER); renderClock();
    const box = $('#decide'); if (!box) return;
    const acts = warnActs(warns);
    const html = `<div class="win decide"><div class="lab">⚠ 前ぶれ・${esc(G.label(Math.max(0, m)))}</div><div class="txt">${warns.map(t => `<p>${esc(t)}</p>`).join('')}</div>${acts.length ? `<div class="wacts">${acts.map(k => `<button class="tog" type="button" data-wa="${k}">${esc(WACT[k]())}</button>`).join('')}</div>` : ''}<p class="small mute" style="margin-top:6px">一時停止した。${acts.length ? '上のボタンで、その場で手を打てる。' : '「1か月休む」や出勤ペースで手を打てる。'}「▶ 再開」で次の月へ進む。</p></div>`;
    if (box.dataset.res) box.insertAdjacentHTML('beforeend', html); else { box.innerHTML = html; box.dataset.res = 1; }
    box.onclick = e => { // ⚠ のボタン（決断の選択肢には反応しない）
      const b = e.target.closest('[data-wa]'); if (!b || b.disabled || !S || S.ended) return;
      const k = b.dataset.wa;
      if (k === 'rest') return restMenu();
      if (k === 'ikinuki') return shop('ikinuki');
      if (k === 'search') return quitMenu();
      if (k === 'eigyo') return eigyoMenu();
      const p = Math.max(1, Math.min(paceMax(), S.pace + (k === 'up' ? 1 : -1)));
      if (p !== S.pace) { S.pace = p; save(); renderPace(); toast(`出勤を週${p}日にした。`); }
      box.querySelectorAll('[data-wa="down"],[data-wa="up"]').forEach(x => { x.textContent = WACT[x.dataset.wa](); x.disabled = (x.dataset.wa === 'down' && S.pace <= 1) || (x.dataset.wa === 'up' && S.pace >= paceMax()); });
    };
    scrollToBox(box);
  }
  const paceMax = () => G.HIRU_MAX[S.e.hiru]; // 出られる日数の上限
  function doFinish() { // 返す値：その月に出た ⚠ の前ぶれ
    const r = G.finish(S); S.phase = 'begin';
    const h = r.rec, add = [];
    // その月にあった小さな出来事 → 数字のまとめ → 節目、の順に差しこむ
    (r.story || []).forEach(t => add.push(['nichi', t]));
    (r.notes || []).forEach(t => add.push([t.startsWith('⚠') ? 'warn' : 'note', t]));

    else if (!h.days) add.push(['sum', `今月は店に出なかった。売上もお給料もなし${h.fine ? `（罰金${man(h.fine / 1e4)}円は引かれた）` : ''}。`]);
    else {
      const ded = h.kousei + h.okuri + h.normaPen + h.fine;
      add.push(['sum', `売上 <b>${man(h.sales)}円</b>・${h.cast ? `${h.cast}人中${h.rank}位` : `No.${h.rank}`}・お給料 ${man(h.pay / 1e4)}円${h.inHosho ? '（保証）' : h.hanbun ? '（折半）' : ''}${ded ? `・引かれ物 ${man(ded / 1e4)}円` : ''}`]);
      add.push(['sum', `指名 ${h.nCust}人${h.nNew || h.nSns ? `（新しく${h.nNew + h.nSns}人` : '（'}${h.gone ? `${h.nNew || h.nSns ? '・' : ''}離れた${h.gone}人）` : h.nNew || h.nSns ? '）' : '新しい指名なし）'}${h.douhan ? `・同伴${h.douhan}回` : ''}`]);
    }
    if (h.normaMiss) add.push(['warn', `${h.normaMiss}。`]);
    r.ms.forEach(t => add.push(['ms', '★ ' + t]));
    if (r.hint) add.push(['hint', r.hint]);
    if (r.ms.length) toast('★ ' + r.ms[r.ms.length - 1]);
    if (r.year) add.push(['year', `── ${r.year.n}年目の年間売上 ${man(r.year.sales)}円 ──`]);
    addFeed(h.m, add);
    save();
    if (r.ms.some(t => t.startsWith('月の売上が1億円'))) okuCelebrate(h);
    return S.ended ? [] : (r.notes || []).filter(t => t.startsWith('⚠'));
  }
  function addFeed(m, items) {
    if (!S.feed) S.feed = [];
    const last = S.feed[S.feed.length - 1];
    if (last && last.m === m) last.items.push(...items); else S.feed.push({ m, items: items.slice() });

  }
  function renderFeed() {
    const el = $('#feed'); if (!el) return;
    const groups = (S.feed || []).slice().reverse();
    const show = FEEDALL ? groups : groups.slice(0, 24);
    el.innerHTML = `<h3><span>人生の記録</span><span>新しい順</span></h3>${show.map(g => `<div class="mo"><div class="ml">${esc(G.label(g.m))}</div>${g.items.map(([k, t]) => `<p class="${k}">${k === 'sum' ? t : esc(t)}</p>`).join('')}</div>`).join('') || '<p class="mute small">まだ記録はない。</p>'}${!FEEDALL && groups.length > 24 ? '<button class="feedmore" type="button" id="fm">以前の記録をもっと見る</button>' : ''}`;
    if ($('#fm')) $('#fm').onclick = () => { FEEDALL = true; renderFeed(); };
  }
  function showDecision(v, run) {
    const box = $('#decide'); if (!box) return;
    delete box.dataset.res;
    box.innerHTML = `<div class="win decide"><div class="lab">決断が待っています・${esc(G.label(v.m))}${v.second ? '（今月2つ目）' : ''}</div><div class="txt">${v.text.map(t => `<p>${esc(t)}</p>`).join('')}</div><div class="choices">${v.choices.filter(c => !c.hide).map(c => `<button class="choice" type="button" data-i="${c.i}" ${c.ok ? '' : 'disabled'}>${esc(c.l)}${c.h ? `<small class="hint">${esc(c.h)}</small>` : ''}</button>`).join('')}</div></div>`;

      setTimeout(() => {
        if (run !== RUN) return;
        const out = G.choose(S, i, byAuto);
        box.innerHTML = '';
        addFeed(v.m, v.text.map(t => ['ev', t]).concat([['pick', `→ 「${v.choices[i].l}」${byAuto ? '（おまかせ）' : ''}`]], out.map(t => ['out', t])));
        renderStat(); renderPace();
        if (S.ended) { ending(); return; }
        if (S.flags.search) { S.phase = 'search'; S.searchFrom = 'month'; save(); search(S.flags.search); return; }
        const v2 = G.second(S); // 同じ月の2つ目の決断（誕生日の準備）
        if (v2 && !v2.info && v2.habit < 0) { S.phase = 'choose'; save(); renderStat(); showDecision(v2, run); return; }
        if (v2) { autoResolve(v2); if (S.ended) { ending(); return; } }

        if (S.ended) { ending(); return; }

        if (PAUSED) { // 止めたまま、決断の結果を読める
          box.dataset.res = 1;
          box.innerHTML = `<div class="win decide"><div class="lab">決断の結果・${esc(G.label(v.m))}</div><div class="txt"><p class="mute">→ 「${esc(v.choices[i].l)}」</p>${out.map(t => `<p>${esc(t)}</p>`).join('')}</div><p class="small mute" style="margin-top:6px">一時停止中。「▶ 再開」で次の月へ進む。</p></div>`;

  // 決断の枠の頭が、上に貼りついたステータスの下にかくれないようにスクロールする

  // くわしいステータス（重ねる画面。開いているあいだは時間が止まる）

  // 明細の内訳は0.1万円まで出す（上の売上とぴったり合うように、端数はいちばん大きい行で調整する）
  const man1 = v => (Math.abs(v) >= 1e4 ? man(v) : (Math.round(v * 10) / 10).toLocaleString('ja-JP', { maximumFractionDigits: 1 }) + '万');
  const fitSum = (rows, total) => {
    const u = x => Math.round(x * 10), d = u(total) - rows.reduce((a, r) => a + u(r[1]), 0);
    rows.forEach(r => { r[1] = u(r[1]) / 10; });
    if (d && rows.length) { const i = rows.reduce((b, r, k) => (Math.abs(r[1]) > Math.abs(rows[b][1]) ? k : b), 0); rows[i][1] = (u(rows[i][1]) + d) / 10; }
    return rows;
  };
  // 家計簿：先月末の貯金 → 月のあいだに使ったお金 → お給料の手取り − 出ていくお金 → 今月末の貯金
  function kakeiboHtml(h) {
    const k = h.kb, sg = v => (v < 0 ? 'マイナス' : '') + man1(Math.abs(v));
    const mid = k.items.map(([n, v]) => [esc(n), v, '']).concat(Math.abs(k.other) >= 0.05 ? [['出来事など', k.other, '出来事でのお金・確定申告の税金など']] : []);
    const goalN = { gakuhi: '学費', okuri: '実家への仕送り' }[k.goalL] || 'お金の目的';
    const end = (h.idle ? [] : [['お給料の手取り（明細の差引支給額）', k.tedori, '']]).concat([['生活費', -k.live, k.live ? '家賃・食費など（夜の収入でまかなう分）' : '昼のお給料や実家でまかなっている']],
      k.beauty ? [['美容・衣装', -k.beauty, 'ヘアメイク・ネイル・ドレスなど']] : [], k.host ? [['ホスト', -k.host, '']] : [], k.kare ? [[k.kare > 0 ? '彼氏に貸したお金' : '彼氏が出してくれたお金', -k.kare, '']] : [],
      k.drug ? [['薬', -k.drug, '']] : [], k.hob ? [[k.hob > 0 ? '趣味（パチンコ・タバコ）' : '趣味（パチンコの勝ち）', -k.hob, '']] : [], k.loan ? [['ローンの返済', -k.loan, '']] : [], k.goal ? [[goalN, -k.goal, 'お金の目的']] : []);
    fitSum(mid.concat(end.slice(h.idle ? 0 : 1)), k.end - k.s0 - (h.idle ? 0 : k.tedori)); // 端数（0.1万円）をそろえる（お給料の手取りは明細と同じ数字のまま）
    const row = ([n, v, sub]) => `<div class="prow"><span>${n}${sub ? `<br><small>${esc(sub)}</small>` : ''}</span><b>${v > 0 ? '+' : v < 0 ? '−' : ''}${man1(Math.abs(v))}円</b></div>`;
    return `<div class="paper">
        <div class="pband"><b>${G.calOf(h.m)}月の家計簿</b><span>貯金がこの額になったわけ</span></div>
        <div class="prow"><span>先月末の貯金</span><b>${sg(k.s0)}円</b></div>
        ${mid.length ? `<div class="pcap">月のあいだに使ったお金・入ったお金</div>${mid.map(row).join('')}` : ''}
        <div class="pcap">月のおわり${h.idle ? '（店が決まっていない月）' : ''}</div>
        ${end.map(row).join('')}
        <div class="prow total"><span>今月末の貯金</span><b>${sg(k.end)}円</b></div>
        <div class="pnote">源泉所得税は、お給料から引かれている（明細の控除）。確定申告の月は、残りの税金を「出来事など」で払う。ローンで買ったものは、月々の返済で出ていく。</div>
      </div>`;
  }
  function meisai() {

  // 結果の解析は、Worker をいくつか（CPU の数に合わせて最大4つ）使って同時に計算する。乱数は最初に決まっているので、1つで計算したときと同じ答えになる。
  // Worker が使えないときは、画面を止めないように少しずつ計算する（inline）
  const WORKER_SRC = '\n;var S0=null,PL=null,CS=null,MEMO=new Map(),MEMO2=new Map();self.onmessage=function(e){var m=e.data,r={id:m.id};try{'
    + 'if(m.init){S0=OKU.revive(JSON.parse(m.init));PL=OKU.analysisPlan(S0);CS=OKU.forkCands(S0,PL);r.N=PL.N;r.NB=PL.NB;r.NB2=PL.NB2;r.cands=CS;}'
    + 'else if(m.same){r.rows=m.idx.map(function(i){return [i,OKU.sameRun(S0,PL,i)];});}'
    + 'else if(m.ev){var c=null;for(var j=0;j<CS.length;j++)if(CS[j].key===m.ev)c=CS[j];r.v=OKU.forkEval(S0,PL,c,m.n,MEMO);}'
    + 'else if(m.chk){var f=m.chk;r.f=OKU.forkCheck(S0,PL,f,MEMO2);}'
    + '}catch(err){r.err=String(err&&err.message||err);}postMessage(r);};';
  function startAnalysis() {
    AN = null; PART = null;
    const snap = JSON.stringify({ ...S, feed: [] });
    const inline = () => {
      const s = G.revive(JSON.parse(snap)), it = G.analyzeSteps(s);
      const step = () => { const t0 = performance.now(); let x; do { x = it.next(); if (!x.done && x.value.part) progress(x.value); } while (!x.done && performance.now() - t0 < 25); if (x.done) { AN = x.value; onAnalysis(); } else { progress(x.value); setTimeout(step, 0); } };
      setTimeout(step, 30);
    };
    let ws = [];
    const stop = () => { ws.forEach(w => w.terminate()); ws = []; };
    try {
      const K = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1));
      const url = URL.createObjectURL(new Blob([$('#engine').textContent + WORKER_SRC], { type: 'text/javascript' }));
      ws = Array.from({ length: K }, () => new Worker(url));
      analyzeParallel(ws, snap).then(an => { stop(); if (!AN) { AN = an; onAnalysis(); } }).catch(() => { stop(); if (!AN) inline(); });
    } catch (err) { stop(); inline(); }
  }
  async function analyzeParallel(ws, snap) {
    let seq = 0;
    const call = (w, msg) => new Promise((res, rej) => {
      const id = ++seq, h = e => { if (e.data.id !== id) return; w.removeEventListener('message', h); if (e.data.err) rej(new Error(e.data.err)); else res(e.data); };
      w.addEventListener('message', h); w.onerror = ev => { if (ev && ev.preventDefault) ev.preventDefault(); rej(new Error('worker')); };
      w.postMessage({ ...msg, id });
    });
    const K = ws.length, inits = await Promise.all(ws.map(w => call(w, { init: snap })));
    const { N, NB, NB2, cands } = inits[0];
    // 1) 同じ生まれのやり直し：2回ずつ、空いた Worker から順に
    const rows = new Array(N), q = []; let done = 0;
    for (let i = 0; i < N; i += 2) q.push([i, i + 1].filter(x => x < N));
    await Promise.all(ws.map(async w => { while (q.length) { const idx = q.shift(), r = await call(w, { same: 1, idx }); for (const [i, v] of r.rows) rows[i] = v; done += idx.length; progress({ phase: 'same', done, total: N }); } }));
    const head = G.headOf(S, { N }, rows);
    progress({ part: head }); // 型と「同じ生まれで、やり直すと」は先に出す
    // 2) 分かれ道：同じ時点の候補は同じ Worker に（「あなたの選択」の計算を使い回せる）。残りの月が長い時点ほど重いので、軽い Worker から順に割りふる
    const spis = [...new Set(cands.map(c => c.spi))], load = new Array(K).fill(0), owner = new Map();
    const cost = spi => cands.filter(c => c.spi === spi).length * (G.MAX_M - Math.max(0, ...cands.filter(c => c.spi === spi).map(c => c.m)));
    spis.sort((a, b) => cost(b) - cost(a)).forEach(spi => { const k = load.indexOf(Math.min(...load)); owner.set(spi, k); load[k] += cost(spi); });
    const evalAll = async (list, n, phase) => { let d = 0; await Promise.all(ws.map(async (w, k) => { for (const c of list.filter(x => owner.get(x.spi) === k)) { const r = await call(w, { ev: c.key, n }); [c.base, c.val] = r.v; d++; progress({ phase, done: d, total: list.length }); } })); };
    await evalAll(cands, NB, 'forks');
    const big = G.pickForks(cands);
    // 3) 差が大きかった分かれ道を、しぼるのに使ったのとは別の乱数で確かめる（向きが変わったもの・差が小さくなったものは出さない）
    let d3 = 0;
    await Promise.all(ws.map(async (w, k) => { for (const c of big.filter(x => owner.get(x.spi) === k)) { const r = await call(w, { chk: c }); Object.assign(c, { base: r.f.base, val: r.f.val, keep: r.f.keep }); d3++; progress({ phase: 'check', done: d3, total: big.length }); } }));
    return { ...head, forks: G.forksOut(big) };
  }
  function progress(p) {

    const el = $('#anprog'), fe = $('#forkprog');
    const t = p.phase === 'same' ? `同じ生まれでやり直し中… ${p.done}/${p.total}` : p.phase === 'forks' ? `分かれ道をたしかめ中… ${p.done}/${p.total}` : `差が大きい分かれ道を、別の運でもう一度たしかめ中… ${p.done}/${p.total}`;
    if (el) el.textContent = t;
    if (fe) fe.textContent = t;
  }

  function drawCard(kind) { // kind：v＝縦長（1080×1350・投稿とLINE）・s＝ストーリー（1080×1920・9:16）・h＝横長（1200×675・X）

    const DOT = '"DotGothic16", "Hiragino Sans", sans-serif';
    const txt = (s, x, y, size, color, align = 'center', maxW = W - 160) => {
      c.font = `${size}px ${DOT}`; let z = size;

    };
    const logo = (x, y, size, d, maxW = W - 160) => { // 題字：「億女」を大きく、「シミュレーター」を小さく同じ行に。幅に入らなければ小さくする（影→本体の順に描く）
      const z2 = z => Math.round(z * .55), wOf = (s, z) => { c.font = `${z}px ${DOT}`; return c.measureText(s).width; };
      let z = size;
      while (wOf('億女', z) + wOf('シミュレーター', z2(z)) > maxW && z > 24) z -= 2;
      const wa = wOf('億女', z), x0 = x - (wa + wOf('シミュレーター', z2(z))) / 2;
      c.textAlign = 'left';
      [[d, '#6b2a4d'], [0, '#ecc66b']].forEach(([o, col]) => { c.fillStyle = col; c.font = `${z}px ${DOT}`; c.fillText('億女', x0 + o, y + o); c.font = `${z2(z)}px ${DOT}`; c.fillText('シミュレーター', x0 + wa + o, y + o); });
    };
    const box = (x, y, w, h, label, v, ls, vs, mw) => { c.strokeStyle = '#efeaf6'; c.lineWidth = 3; c.strokeRect(x, y, w, h); txt(label, x + w / 2, y + ls + 14, ls, '#a89eb8', 'center', w - 16); txt(String(v), x + w / 2, y + h - vs * 0.42, vs, v >= 80 ? '#ff73a8' : '#ecc66b', 'center', mw || w - 16); };
    // 歩んだ店：最初の店はかならず入れる（多いときは「最初の店 → … → 最後のほう」）

      st.forEach((x, i) => txt(x ? `${G.label(x.from)}〜 ${stName(x)}` : '…', W / 2, 1468 + i * 54, 32, '#efeaf6', 'center', W - 160));
      const yEnd = 1468 + (st.length - 1) * 54; // 店の数が少ないときは、そのぶん上に寄せる
      txt(`実績 ${sm.ach.length}/${G.ACHV.length}${sm.oku ? '' : `・億女まで あと${man(G.OKU - sm.bestMonth)}円`}`, W / 2, Math.min(1745, yEnd + 80), 30, '#a89eb8');

    }
    if (wide) {
      const Lx = 330, Rx = 875, mw = 500;
      logo(Lx, 157, 88, 5, mw);
      txt(`人生${S.life || lives()}周目・${S.name}（${S.age0}歳・${S.e0.pref}出身）`, Lx, 212, 28, '#a89eb8', 'center', mw);
      if (sm.oku) { txt('億女 達成', Lx, 335, 96, '#ff73a8', 'center', mw); txt(`月間売上 ${man(sm.bestMonth)}円`, Lx, 400, 40, '#ecc66b', 'center', mw); }
      else { txt('いちばん売れた月', Lx, 282, 32, '#a89eb8', 'center', mw); txt(`${man(sm.bestMonth)}円`, Lx, 392, 104, '#ecc66b', 'center', mw); }
      txt(sm.bestMonthStore ? `${G.label(sm.bestMonthM)}・${sm.bestMonthStore}` : '', Lx, 455, 26, '#efeaf6', 'center', mw);
      txt(pos, Lx, 503, 28, '#ff73a8', 'center', mw);
      txt('#億女シミュレーター', Lx, 590, 36, '#ecc66b', 'center', mw);
      c.strokeStyle = 'rgba(239, 234, 246, .35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(615, 95); c.lineTo(615, 585); c.stroke();
      txt('夜の型', Rx, 128, 26, '#a89eb8', 'center', 480); txt(A ? A.type : '……', Rx, 186, 46, '#efeaf6', 'center', 480);
      const b3 = (480 - 30) / 3; [['ルックス', t.face], ['スタイル', t.style], ['お酒', t.sake]].forEach(([k, v], i) => box(Rx - 240 + i * (b3 + 15), 220, b3, 125, k, v, 24, 54));
      if (A) { const b4 = (480 - 36) / 4; ['生まれ', '運', '選択', '努力'].forEach((k, i) => box(Rx - 240 + i * (b4 + 12), 365, b4, 125, k, A.score[k], 24, 52)); }
      // 歩んだ店：小さくしても1行に入らないときは、矢印のところで2行に分ける（前は右の枠の外にはみ出していた）
      c.font = `22px ${DOT}`;
      if (c.measureText(path).width <= 600) txt(path, Rx, 540, 22, '#efeaf6', 'center', 480);
      else {
        const parts = path.split(' → '), half = Math.ceil(parts.length / 2), l1 = parts.slice(0, half).join(' → ') + ' →', l2 = parts.slice(half).join(' → ');
        let z = 22; // 2行とも同じ大きさにそろえる
        while (Math.max(c.measureText(l1).width, c.measureText(l2).width) > 480 && z > 14) { z -= 1; c.font = `${z}px ${DOT}`; }
        txt(l1, Rx, 526, z, '#efeaf6', 'center', 480);

      return cv;
    }
    logo(W / 2, 190, 110, 6);
    txt(`人生${S.life || lives()}周目・${S.name}（${S.age0}歳・${S.e0.pref}出身）`, W / 2, 262, 36, '#a89eb8');
    if (sm.oku) { txt('億女 達成', W / 2, 430, 120, '#ff73a8'); txt(`月間売上 ${man(sm.bestMonth)}円`, W / 2, 510, 50, '#ecc66b'); }
    else { txt('いちばん売れた月', W / 2, 360, 42, '#a89eb8'); txt(`${man(sm.bestMonth)}円`, W / 2, 490, 124, '#ecc66b'); }
    txt(sm.bestMonthStore ? `${G.label(sm.bestMonthM)}・${sm.bestMonthStore}` : '', W / 2, 570, 34, '#efeaf6');

    txt('数字はゲームの目安です', W / 2, 1284, 20, '#a89eb8'); // 内側の枠（下は1300）にかからない高さ
    return cv;
  }
  function confetti() {
    if (RM) return;
    const cv = document.createElement('canvas'); cv.id = 'fx'; document.body.appendChild(cv);
    const w = cv.width = innerWidth, h = cv.height = innerHeight, c = cv.getContext('2d');
    const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, s: 4 + Math.random() * 5, r: Math.random() * 6, col: Math.random() < 0.6 ? '#ecc66b' : '#ff73a8' }));
    const t0 = performance.now();
    const f = t => {
      c.clearRect(0, 0, w, h);
      for (const p of ps) { p.x += p.vx; p.y += p.vy; p.r += 0.1; c.fillStyle = p.col; c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); c.restore(); }
      if (t - t0 < 2600) requestAnimationFrame(f); else cv.remove();
    };
    requestAnimationFrame(f);
  }

  // ── はじまり（ページの更新が届いても、遊んでいる人生はそのまま） ──
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ s: S && !S.ended ? JSON.stringify(S) : null }));
  const boot = data => {
    if (data && data.s) { try { S = G.revive(JSON.parse(data.s)); resume(); return; } catch (e) { S = null; } }
    title();
  };
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
